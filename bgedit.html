<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>bgedit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      color: white;
      background-color: #0f3d73;

      /* ===================================================== */
      /* STUDENT EDIT AREA 1                                  */
      /* CHANGE BACKGROUND IMAGE HERE - START                  */
      /* The image file and this HTML file must be together.    */
      /* Change ONLY the file name inside " ".                  */
      /* Example: url("cat.jpg") or url("mountain.png")        */
      /* ===================================================== */

      background-image: url("background.jpg");

      /* ===================================================== */
      /* CHANGE BACKGROUND IMAGE HERE - END                    */
      /* ===================================================== */

      /* ===================================================== */
      /* STUDENT EDIT AREA 2                                  */
      /* CHANGE BACKGROUND PARAMETERS HERE - START             */
      /* Change ONLY the words after :                          */
      /* Keep the : and ;                                      */
      /* ===================================================== */

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      /* ===================================================== */
      /* CHANGE BACKGROUND PARAMETERS HERE - END               */
      /* Save the file. Refresh browser.                       */
      /* ===================================================== */
    }

    .card {
      background: rgba(0,0,0,.55);
      border: 5px solid rgba(255,255,255,.85);
      border-radius: 28px;
      padding: 44px;
      max-width: 900px;
      margin: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,.30);
    }

    h1 {
      font-size: 70px;
      margin: 0 0 24px 0;
    }

    p {
      font-size: 30px;
      margin: 16px 0;
    }

    .small {
      font-size: 22px;
      margin-top: 36px;
      opacity: .9;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Background Edit Page</h1>
    <p>CSS can use a picture as the page background.</p>
    <p>Change the image name and background parameters.</p>
    <p class="small">File name: bgedit.html</p>
  </main>
</body>
</html>
