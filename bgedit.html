<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Edit</title>
  <style>

    /* ========================================================= */
    /* STUDENT EDIT AREA                                        */
    /* CHANGE ONLY THIS PART.                                   */
    /* ========================================================= */

    body {
      /* --------------------------------------------------------- */
      /* BACKGROUND PICTURE: TWO VARIANTS                         */
      /*                                                           */
      /* Variant 1 is ON now. It uses a picture in the same folder. */
      /* bgedit.html and background.jpg must be together.           */
      /* Students do NOT need https:// for this variant.            */
      /* --------------------------------------------------------- */
      background-image: url("background.jpg");

      /* --------------------------------------------------------- */
      /* Variant 2 is OFF now. It uses a picture from the Internet. */
      /* To turn it ON, remove the comment marks from the next line.*/
      /* When two background-image lines are ON, the LOWER line wins.*/
      /* --------------------------------------------------------- */
      /* background-image: url("https://jma-its.github.io/jma-its/background.jpg"); */

      /* Picture size. Try: cover / contain / auto */
      background-size: cover;

      /* Picture position. Try: center / top / bottom / left / right */
      background-position: center;

      /* Repeat picture? Try: no-repeat / repeat */
      background-repeat: no-repeat;

      /* Keep picture fixed? Try: fixed / scroll */
      background-attachment: fixed;
    }

    .box {
      /* Text box colors. Try: white / lightyellow / black */
      background-color: white;

      /* Text color. Try: darkblue / black / white / purple */
      color: darkblue;
    }

    /* ========================================================= */
    /* END OF STUDENT EDIT AREA                                 */
    /* DO NOT CHANGE BELOW THIS LINE.                            */
    /* ========================================================= */

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 40px;
      text-align: center;
    }

    .box {
      max-width: 980px;
      margin: 60px auto;
      border: 4px solid darkblue;
      border-radius: 28px;
      padding: 38px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.30);
    }

    h1 {
      font-size: 56px;
      margin: 0 0 18px;
    }

    p {
      font-size: 30px;
      line-height: 1.45;
      margin: 16px 0;
    }

    .small {
      font-size: 24px;
      color: #333333;
    }

    code {
      background: #eeeeee;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Background Edit</h1>
    <p><b>Variant 1:</b> use <code>background.jpg</code> in the same folder.</p>
    <p><b>Variant 2:</b> use a full web link inside <code>url("...")</code>.</p>
    <p>Find <b>STUDENT EDIT AREA</b> in Notepad.</p>
    <p class="small">Save with Ctrl + S. Refresh the browser with F5.</p>
  </div>
</body>
</html>
